services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  battlearena.api:
    image: ${DOCKER_REGISTRY-}battlearenaapi
    build:
      context: .
      dockerfile: BattleArena.Api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=${SQL_SERVER_HOST:-192.168.1.124},${SQL_SERVER_PORT:-14330};Database=BattleArena;User Id=EBBankingAppDB;Password=ChanChanOda.5296;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      Elasticsearch__Enabled: "true"
      Elasticsearch__Url: "http://elasticsearch:9200"
      Elasticsearch__CharactersIndex: "characters"
    depends_on:
      - elasticsearch
      - redis
      - rabbitmq

  battlearena.api-2:
    image: ${DOCKER_REGISTRY-}battlearenaapi
    build:
      context: .
      dockerfile: BattleArena.Api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=${SQL_SERVER_HOST:-192.168.1.124},${SQL_SERVER_PORT:-14330};Database=BattleArena;User Id=EBBankingAppDB;Password=ChanChanOda.5296;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      Elasticsearch__Enabled: "true"
      Elasticsearch__Url: "http://elasticsearch:9200"
      Elasticsearch__CharactersIndex: "characters"
    depends_on:
      - elasticsearch
      - redis
      - rabbitmq

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - battlearena.api
      - battlearena.api-2
