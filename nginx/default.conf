upstream battlearena_upstream {
    server battlearena.api:8080;
    server battlearena.api-2:8080;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://battlearena_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}